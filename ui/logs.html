<!doctype html>
<!--
  llm-router 「Logs 日志与调试」页面（自包含单文件：内联 CSS/JS，无外部 CDN、无构建工具、无 service worker）

  用途：llm-router（Rust axum 网关）把官方 llama.cpp webui 静态挂在 /_ui/ 下，本文件与之同目录。
        页面通过 ./logs、./stats、./logs/stream 三个相对接口读取网关的请求环形缓冲；
        页面自身在 /_ui/logs.html，因此 ./logs 解析为 /_ui/logs。http 明文可用。

  官方 webui 升级后如何恢复：
    本文件与 logs-inject.js 都不在 SvelteKit 构建产物里（也不在 ui/sw.js 的 precache 列表），
    升级 llama.cpp 的 ui/ 目录时只要不整目录删除就不会丢；真正会被覆盖的是 index.html 里的注入行：
        cd <仓库> && bash watcher/patch_ui_logs.sh      # 幂等重打 index.html 注入
    http 明文下浏览器不暴露 navigator.serviceWorker，所以没有 workbox 旧缓存挡新文件的问题；
    若将来改用 https / localhost 访问，改完 index.html 需同步重算 ui/sw.js 里 "./" 条目的 revision。
-->
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 内联空 favicon：避免浏览器自动请求 /favicon.ico 产生 404 噪声，掩盖真实报错 -->
<link rel="icon" href="data:,">
<title>Logs · llm-router</title>
<style>
/* 配色与 llama-ui 同风格（近黑底 + 状态码绿色），暗色层级取自 opencodex dashboard 规格 */
:root{
  color-scheme:dark;
  --bg:#0d0d0f; --surface:#171719; --raised:#1f1f22; --raised-hover:#28282c;
  --border:#2c2c31; --border-soft:#232326; --hover:#ffffff0a;
  --text:#ececec; --muted:#a3a3ab; --faint:#7c7c85;
  --green:#4ecb9d; --red:#f87171; --amber:#fbbf24; --gray:#8a8a92;
  --radius:12px; --radius-sm:8px; --radius-pill:999px;
  --font-code:ui-monospace,"SFMono-Regular","Cascadia Code","JetBrains Mono","Noto Sans Mono CJK SC",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--text);margin:0}
body{font-family:var(--font-code);font-size:13px;line-height:1.5;padding:0 16px 24px;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:var(--muted);text-decoration:none}
a:hover{color:var(--text)}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
code{font-family:var(--font-code);font-size:12px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:var(--radius-pill);border:2px solid var(--bg)}

.wrap{max-width:1240px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 0 10px;flex-wrap:wrap}
.topbar h1{font-size:16px;font-weight:600;margin:0}
.conn{margin-left:auto;color:var(--gray);font-size:12px}
.conn[hidden]{display:none}

.summary{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:8px 14px;min-width:106px}
.stat .k{color:var(--muted);font-size:11px;white-space:nowrap}
.stat .v{font-size:16px;font-weight:600;margin-top:2px;white-space:nowrap}
.stat .v small{font-size:11px;font-weight:400;color:var(--muted)}

.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.input{background:var(--raised);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:7px 11px;font:inherit;color:var(--text);min-width:240px;max-width:460px;flex:1 1 240px}
.input::placeholder{color:var(--faint)}
.input:focus{outline:none;border-color:var(--faint)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border:1px solid var(--border);
  border-radius:var(--radius-pill);background:var(--surface);font-size:12px;color:var(--text)}
.btn:hover{background:var(--raised)}
.buf{margin-left:auto;color:var(--faint);font-size:11px;white-space:nowrap}

.tbl-wrap{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);
  overflow:auto;max-height:calc(100vh - 318px);min-height:180px;scrollbar-gutter:stable}
table{table-layout:fixed;width:100%;min-width:1040px;border-collapse:collapse;font-size:13px}
/* 列宽沿用 opencodex logs 页：12/9/7/8/15/9/13/8/11/8 */
/* 8 列：12/9/7/16/10/16/10/10 */
col.c-time{width:12%} col.c-tok{width:9%} col.c-rate{width:7%}
col.c-model{width:16%} col.c-effort{width:10%} col.c-provider{width:16%} col.c-status{width:10%}
col.c-dur{width:10%}
thead{position:sticky;top:0;z-index:1;background:var(--surface)}
th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:9px 12px;
  border-bottom:1px solid var(--border);white-space:nowrap}
th.num,td.num{text-align:right}
td{border-bottom:1px solid var(--border-soft);padding:9px 12px;vertical-align:middle;overflow:hidden}
tbody tr.row:hover td{background:var(--hover)}
.muted{color:var(--muted)} .bold{font-weight:700}
.stack{display:inline-flex;flex-direction:column;align-items:flex-end;gap:2px;line-height:1.2}
.sub{font-size:11px;color:var(--muted)}
.nowrap{white-space:nowrap}
.st{display:inline-flex;flex-direction:column;align-items:flex-start;gap:2px;line-height:1.2}
.st .code{font-weight:700}
.s2{color:var(--green)} .s4{color:var(--amber)} .s5{color:var(--red)} .sc{color:var(--gray)}
.detail-btn{font-size:11px;text-decoration:underline;color:var(--muted);white-space:normal;text-align:left}
.detail-btn:hover{color:var(--text)}
.reqid{max-width:13ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.model{max-width:16ch;overflow-wrap:anywhere}
.dash{color:var(--faint)}

tr.detail>td{background:var(--raised);padding:0 12px 12px;border-bottom:1px solid var(--border)}
.detail-in{max-width:860px}
.sec{border-top:1px solid var(--border-soft);padding:12px 0}
.detail-in .sec:first-child{border-top:none}
.sec h3{font-size:12px;font-weight:600;margin:0 0 8px;color:var(--text)}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 14px;font-size:12px}
.kv .k{color:var(--muted)}
.kv .v{overflow-wrap:anywhere}
.kv .v .btn{margin-left:8px}
.cand{display:block}
.cand .ok{color:var(--green)}
.note{color:var(--faint);font-size:11px;margin-top:8px}

.empty{border:1px dashed var(--border);border-radius:var(--radius);color:var(--muted);
  padding:44px 20px;text-align:center;margin-top:12px}
.empty[hidden]{display:none}
.empty code{display:inline-block;margin-top:10px;background:var(--raised);border:1px solid var(--border-soft);
  border-radius:var(--radius-sm);padding:6px 10px;color:var(--faint);text-align:left;overflow-wrap:anywhere}

/* 窄屏隐藏 ~$ 与 提供方：col 上的 display:none 不生效，必须同时把宽度归零并重新分配 */
@media (max-width:900px){
  th.c-provider,td.c-provider{display:none}
  col.c-provider{width:0}
  col.c-time{width:16%} col.c-tok{width:12%} col.c-rate{width:9%} col.c-model{width:22%}
  col.c-effort{width:14%} col.c-status{width:12%} col.c-dur{width:9%}
  table{min-width:640px}
  .stat{min-width:88px;padding:7px 10px}
}
</style>
</head>
<body>
<div class="wrap">
  <div id="lmr-tabs-anchor"></div>
  <div class="topbar">
    <h1>Logs 日志与调试</h1>
    <span class="conn" id="conn" hidden>连接中断，重试中</span>
  </div>

  <div class="summary" id="summary">
    <div class="stat"><div class="k">当前并发</div><div class="v" id="s-inflight">-</div></div>
    <div class="stat"><div class="k">输出 tok/s</div><div class="v" id="s-out">-</div></div>
    <div class="stat"><div class="k">输入 tok/s</div><div class="v" id="s-in">-</div></div>
    <div class="stat"><div class="k">窗口请求 / 错误</div><div class="v" id="s-req">-</div></div>
    <div class="stat"><div class="k">平均 TTFT</div><div class="v" id="s-ttft">-</div></div>
    <div class="stat"><div class="k">运行时长</div><div class="v" id="s-up">-</div></div>
  </div>

  <div class="toolbar">
    <input class="input" id="filter" type="search" autocomplete="off" spellcheck="false"
      placeholder="筛选日志（模型 / 提供方 / 请求 ID / 会话 / 状态码）">
    <button class="btn" id="clear" type="button">清空</button>
    <span class="buf" id="buf">-/-</span>
  </div>

  <div class="tbl-wrap" id="wrap">
    <table>
      <colgroup>
        <col class="c-time"><col class="c-tok"><col class="c-rate">
        <col class="c-model"><col class="c-effort"><col class="c-provider"><col class="c-status">
        <col class="c-dur">
      </colgroup>
      <thead>
        <tr>
          <th>时间</th><th class="num">Token 数</th><th class="num" title="按完整请求耗时计算的每秒输出 token">tok/s</th>
          <th>模型</th><th>推理强度</th><th class="c-provider">提供方</th><th>状态</th><th class="num">耗时</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="empty" id="empty" hidden>
    <div>暂无请求</div>
    <div class="muted" style="margin-top:6px">网关还没有记录到任何请求，也可以直接查环形缓冲接口确认：</div>
    <code id="curl-eg">curl</code>
  </div>
</div>

<script>
"use strict";
/* ===================== 数据层 =====================
   两路数据源汇入同一个前端缓冲：
     1) GET ./logs?cursor=<seq>  1s 轮询增量（权威、断线后可恢复）
     2) GET ./logs/stream        SSE 低延迟追加
   按 record.seq 去重（seen 表），因此两路重复投递同一请求只会渲染一次，
   流式路径永远只 prepend <tr>（不整表重建）；只有筛选/清空/服务重启才 rebuild。
   渲染顺序是「最新在最上面」：rows 数组仍按 seq 升序，DOM 取反向渲染，
   新请求出现在表格顶部；页面不做任何自动滚动，正在往下看历史时视口保持不动。
   stats.started_at_ms 变化 = 网关进程重启 → 环形缓冲作废 → 前端整体重置。 */
var MAX_ROWS = 2000;                 // 前端最多留 2000 行，超出丢最旧
var POLL_MS = 1000;
var rows = [];                       // record 数组（seq 升序）
var seen = Object.create(null);      // seq -> true
var cursor = 0;                      // 已消费的最大 seq，用于增量拉取
var startedAtMs = null;              // stats.started_at_ms，变化即重置
var expanded = Object.create(null);  // seq -> true（重建后保持展开）
var stats = null;
var loadedOnce = false;
var backends = Object.create(null);  // worker host:port -> {gpu}（GET ./logs/backends）
var lastBackendsAt = 0;              // backends 低频刷新（30s）

var tbody = document.getElementById('tbody');
var emptyBox = document.getElementById('empty');
var filterBox = document.getElementById('filter');
var connBox = document.getElementById('conn');
var bufBox = document.getElementById('buf');

var ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
function esc(s){ return String(s).replace(/[&<>"']/g, function(ch){ return ESC[ch]; }); }
function num(v){ return (v === null || v === undefined || typeof v !== 'number' || !isFinite(v)) ? null : v; }
function hasUsage(r){ return (num(r.completion_tokens) || 0) > 0 || (num(r.prompt_tokens) || 0) > 0; }
function estMark(r){ return r.tokens_estimated ? '<span class="dash">≈</span>' : ''; }

/* ---------- 格式化（规则对齐 opencodex logs 页逆向规格） ---------- */
function fmtTime(ms){                       // 本地时区 YYYY/M/D HH:MM:SS
  var d = new Date(ms), p = function(x){ return x < 10 ? '0' + x : '' + x; };
  return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate() +
    ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}
/* 紧凑计数：>=1万 → 1 位小数 + 万（向下取整，不虚增），与参考实现的 Kn() 一致 */
function fmtCount(n){
  if (n >= 1e8) return (Math.floor(n / 1e6) / 10).toFixed(1) + '亿';
  if (n >= 1e4) return (Math.floor(n / 1e3) / 10).toFixed(1) + '万';
  return String(n);
}
function fmtTok(r){                         // tok/s：整数；tokens_estimated 时前缀灰色 ≈
  var v = num(r.tok_per_s);
  if (v === null || v <= 0) return '<span class="dash">-</span>';
  return estMark(r) + String(Math.round(v));
}
function fmtEffort(r){                      // high → xhigh / 单值 / 灰色 -
  var a = r.requested_effort, b = r.effort;
  if (!a && !b) return '<span class="dash">-</span>';
  if (!a || !b || a === b) return esc(a || b);
  return esc(a) + ' &rarr; ' + esc(b);
}
/* 提供方单元格：provider 字段非空（openai 远端模式）原样显示；
   本机 worker 显示「:端口 + GPU 号」（GPU 来自 /logs/backends 的 worker labels，
   watcher 注册时带上；拿不到只显示端口）。
   本机 sglang/vllm/llamacpp worker 的 provider 字段是后端类型名（sglang 等），
   不是给人看的名字，所以只要 worker 出现在 backends 清单里就显示端口+GPU。 */
function gpuOfWorker(url){
  if (!url) return null;
  var b = backends[url];
  return b && b.gpu ? String(b.gpu) : null;
}
function providerText(r){
  if (!r.worker) return '';
  if (!backends[r.worker] && r.provider) return r.provider;
  var port = r.worker.slice(r.worker.lastIndexOf(':'));
  var gpu = gpuOfWorker(r.worker);
  return port + (gpu ? ' gpu' + gpu : '');
}
function providerCell(r){
  var t = providerText(r);
  return '<td class="c-provider muted">' + (t ? esc(t) : '<span class="dash">-</span>') + '</td>';
}
function effortPlain(r){
  var a = r.requested_effort, b = r.effort;
  if (!a && !b) return '-';
  if (!a || !b || a === b) return String(a || b);
  return a + ' → ' + b;
}
function statusCls(s){
  if (s === 499) return 'sc';               // 客户端断开：灰
  if (s >= 500) return 's5';
  if (s >= 400) return 's4';
  if (s >= 200 && s < 300) return 's2';
  return 'muted';
}
function fmtDur(ms){
  if (ms === null) return '<span class="dash">-</span>';
  var s = ms + 'ms';
  return ms >= 3000 ? '<span class="bold">' + s + '</span>' : s;
}
function fmtUptime(sec){
  var s = Math.floor(sec), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  if (h > 0) return h + 'h ' + ('0' + m).slice(-2) + 'm';
  if (m > 0) return m + 'm ' + ('0' + (s % 60)).slice(-2) + 's';
  return s + 's';
}

/* ---------- 行渲染 ---------- */
function cellsHtml(r){
  var total = hasUsage(r) ? (num(r.prompt_tokens) || 0) + (num(r.completion_tokens) || 0) : null;
  var cached = num(r.cached_tokens) || 0;
  var tokCell = total === null
    ? '<span class="dash">-</span>'
    : '<span class="stack">' + estMark(r) + fmtCount(total) +
      (cached > 0 ? '<span class="sub">c ' + fmtCount(cached) + '</span>' : '') + '</span>';
  return [
    '<td class="c-time nowrap muted">' + fmtTime(r.ts_ms) + '</td>',
    '<td class="num c-tok">' + tokCell + '</td>',
    '<td class="num c-rate nowrap">' + fmtTok(r) + '</td>',
    '<td class="c-model model">' + (r.model ? esc(r.model) : '<span class="dash">-</span>') + '</td>',
    '<td class="c-effort nowrap">' + fmtEffort(r) + '</td>',
    providerCell(r),
    '<td class="c-status"><span class="st"><span class="code ' + statusCls(r.status) + '">' +
      esc(String(r.status)) + '</span>' +
      '<button type="button" class="detail-btn" data-detail="' + r.seq + '">查看详情</button></span></td>',
    '<td class="num c-dur nowrap">' + fmtDur(num(r.duration_ms)) + '</td>'
  ].join('');
}
/* 解码速率（估算）= completion_tokens / (duration_ms - ttft_ms) */
function decodeRateText(r){
  if (!hasUsage(r)) return '<span class="muted">上游未返回 usage，无法估算</span>';
  var dur = num(r.duration_ms), ttft = num(r.ttft_ms);
  if (ttft === null || dur === null) return '<span class="muted">缺少首个 token 时间，无法估算解码速率。</span>';
  var win = dur - ttft;
  if (win < 1000) return '<span class="muted">首个 token 之后的区间不足一秒，太短，无法估算解码速率。</span>';
  return ((num(r.completion_tokens) || 0) / (win / 1000)).toFixed(1) + ' tokens/s';
}
function detailHtml(r){
  var cands = Array.isArray(r.candidates) ? r.candidates : [];
  var candHtml = cands.length === 0
    ? '<span class="dash">-</span>'
    : cands.map(function(c){
        return '<span class="cand">' + (c === r.selected ? '<span class="ok">\u2713</span> ' : '&nbsp;&nbsp;&nbsp;') + esc(c) + '</span>';
      }).join('');
  var wire = r.effort || r.requested_effort;
  var effortFull = effortPlain(r);
  if (wire) effortFull += ' (reasoning_effort=' + wire + ')';
  var copyBtn = r.id ? '<button type="button" class="btn" data-copy="' + esc(r.id) + '">复制请求 ID</button>' : '';
  var sessBtn = r.session ? '<button type="button" class="btn" data-filter-session="' + esc(r.session) + '">筛选日志</button>' : '';
  return '<div class="detail-in">' +
    '<div class="sec"><h3>基本信息</h3><div class="kv">' +
      '<div class="k">时间</div><div class="v">' + fmtTime(r.ts_ms) + '</div>' +
      '<div class="k">请求</div><div class="v">' + esc(r.id || '-') + copyBtn + '</div>' +
      '<div class="k">会话</div><div class="v">' + (r.session ? esc(r.session) + sessBtn : '<span class="dash">-</span>') + '</div>' +
      '<div class="k">模型</div><div class="v">' + (r.model ? esc(r.model) : '<span class="dash">-</span>') +
        (r.requested_model && r.requested_model !== r.model ? ' <span class="muted">(请求 ' + esc(r.requested_model) + ')</span>' : '') + '</div>' +
      '<div class="k">提供方</div><div class="v">' + (r.provider ? esc(r.provider) : '<span class="dash">-</span>') +
        (r.worker ? ' <span class="muted">· ' + esc(r.worker) + '</span>' : '') + '</div>' +
      '<div class="k">推理强度</div><div class="v">' + esc(effortFull) + '</div>' +
    '</div></div>' +
    '<div class="sec"><h3>路由决策</h3><div class="kv">' +
      '<div class="k">路由类型</div><div class="v">' + (r.route_type ? esc(r.route_type) : '<span class="dash">-</span>') + '</div>' +
      '<div class="k">已选择</div><div class="v">' + (r.selected ? esc(r.selected) : '<span class="dash">-</span>') + '</div>' +
      '<div class="k">候选</div><div class="v">' + candHtml + '</div>' +
      (r.error ? '<div class="k">错误</div><div class="v">' + esc(r.error) + '</div>' : '') +
    '</div></div>' +
    '<div class="sec"><h3>性能</h3><div class="kv">' +
      '<div class="k">耗时</div><div class="v">' + (num(r.duration_ms) === null ? '-' : r.duration_ms + 'ms') + '</div>' +
      '<div class="k">tok/s</div><div class="v">' + (num(r.tok_per_s) === null ? '-' : Math.round(r.tok_per_s)) + '</div>' +
      '<div class="k">TTFT</div><div class="v">' + (num(r.ttft_ms) === null ? '-' : r.ttft_ms + 'ms') + '</div>' +
      '<div class="k">解码速率（估算）</div><div class="v">' + decodeRateText(r) + '</div>' +
      '<div class="k">tokens</div><div class="v muted">prompt ' + (num(r.prompt_tokens) === null ? '-' : fmtCount(r.prompt_tokens)) +
        ' · cached ' + (num(r.cached_tokens) === null ? '-' : fmtCount(r.cached_tokens)) +
        ' · completion ' + (num(r.completion_tokens) === null ? '-' : fmtCount(r.completion_tokens)) +
        ' · reasoning ' + (num(r.reasoning_tokens) === null ? '-' : fmtCount(r.reasoning_tokens)) + '</div>' +
    '</div>' +
      (r.tokens_estimated ? '<div class="note">token 数由输出文本长度估算（上游未返回 usage）</div>' : '') +
    '</div></div>';
}
function makeRow(r){
  var tr = document.createElement('tr');
  tr.className = 'row';
  tr.dataset.seq = String(r.seq);
  tr.innerHTML = cellsHtml(r);
  return tr;
}
function makeDetailRow(r){
  var tr = document.createElement('tr');
  tr.className = 'detail';
  tr.dataset.detailFor = String(r.seq);
  var td = document.createElement('td');
  td.colSpan = 8;
  td.innerHTML = detailHtml(r);
  tr.appendChild(td);
  return tr;
}
function syncDetail(tr, r){ if (expanded[r.seq]) tr.insertAdjacentElement('afterend', makeDetailRow(r)); }

/* ---------- 前端缓冲与增量追加 ---------- */
function ingest(records){
  if (!records || !records.length) return;
  var list = records.slice().sort(function(a, b){ return a.seq - b.seq; });   // 旧→新逐个插顶
  var added = 0;
  for (var i = 0; i < list.length; i++) {
    var r = list[i];
    if (!r || typeof r.seq !== 'number' || seen[r.seq]) continue;   // seq 去重（轮询与 SSE 共用）
    seen[r.seq] = true;
    rows.push(r);                                                    // rows 保持 seq 升序
    if (r.seq > cursor) cursor = r.seq;
    if (matchesFilter(r)) {
      var tr = makeRow(r);
      // 升序逐行插到顶部：后到的新请求总是压在旧行上面 → DOM 顶部永远是最新
      tbody.insertBefore(tr, tbody.firstChild);
      syncDetail(tr, r);
      added++;
    }
  }
  if (!added) return;
  trimFront();
  updateEmpty();
}
/* 软上限：丢弃最旧的行。rows 升序所以最旧在数组头部；DOM 是倒序（最新在上），
   最旧的行因此落在 DOM 尾部——从 lastChild 往前删，碰到仍需保留的行即停
   （展开的详情行 key 不在 keep 表内，会随所属行一并清掉） */
function trimFront(){
  var over = rows.length - MAX_ROWS;
  if (over <= 0) return;
  var keep = {};
  for (var i = over; i < rows.length; i++) keep[rows[i].seq] = true;
  rows = rows.slice(over);
  while (tbody.lastChild) {
    var last = tbody.lastChild;
    var key = last.dataset.seq || last.dataset.detailFor;
    if (key && keep[key]) break;
    tbody.removeChild(last);
  }
}

/* ---------- 筛选（子串匹配；仅用户操作时整表重建） ---------- */
var filterText = '';
function matchesFilter(r){
  if (!filterText) return true;
  var f = filterText.toLowerCase();
  var hay = [r.model, r.requested_model, r.provider, r.id, r.session, String(r.status),
             r.route_type, r.effort, r.requested_effort]
    .filter(function(x){ return x !== null && x !== undefined; }).join(' ').toLowerCase();
  return hay.indexOf(f) !== -1;
}
function rebuild(){
  tbody.innerHTML = '';
  for (var i = rows.length - 1; i >= 0; i--) {   // 倒序渲染：最新在上
    var r = rows[i];
    if (!matchesFilter(r)) continue;
    var tr = makeRow(r);
    tbody.appendChild(tr);
    syncDetail(tr, r);
  }
  updateEmpty();
}
function updateEmpty(){
  var showEmpty = loadedOnce && tbody.querySelector('tr.row') === null;
  emptyBox.hidden = !showEmpty;
  if (showEmpty) document.getElementById('curl-eg').textContent =
    "curl '" + new URL('./logs?cursor=0&limit=1000', location.href).href + "'";
}

/* ---------- 行内交互（事件委托，避免逐行绑监听器） ---------- */
tbody.addEventListener('click', function(ev){
  var t = ev.target;
  var btn = t.closest ? t.closest('[data-detail],[data-copy],[data-filter-session]') : null;
  if (!btn) return;
  if (btn.hasAttribute('data-detail')) {
    var seq = btn.getAttribute('data-detail');
    var row = tbody.querySelector('tr.row[data-seq="' + seq + '"]');
    if (!row) return;
    var rec = findRow(seq);
    if (expanded[seq]) {
      delete expanded[seq];
      var d = tbody.querySelector('tr.detail[data-detail-for="' + seq + '"]');
      if (d) d.remove();
    } else {
      expanded[seq] = true;
      if (rec) row.insertAdjacentElement('afterend', makeDetailRow(rec));
    }
  } else if (btn.hasAttribute('data-copy')) {
    copyText(btn.getAttribute('data-copy'), btn);
  } else if (btn.hasAttribute('data-filter-session')) {
    filterBox.value = btn.getAttribute('data-filter-session');
    filterText = filterBox.value;
    rebuild();
  }
});
function findRow(seq){
  for (var i = rows.length - 1; i >= 0; i--) if (String(rows[i].seq) === String(seq)) return rows[i];
  return null;
}
/* 复制：navigator.clipboard 在非安全上下文（http 明文）不可用 → 降级 textarea + execCommand */
function copyText(text, btn){
  function done(ok){
    var old = btn.textContent;
    btn.textContent = ok ? '已复制' : '复制失败';
    setTimeout(function(){ btn.textContent = old; }, 1200);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ fallback(); });
  } else fallback();
  function fallback(){
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      done(ok);
    } catch (e) { done(false); }
  }
}

/* ---------- 工具条 ---------- */
filterBox.addEventListener('input', function(){ filterText = filterBox.value.trim(); rebuild(); });
document.getElementById('clear').addEventListener('click', function(){
  // 只清前端视图：后端环形缓冲不动，cursor 保留，因此不会重复拉回旧数据
  rows = []; seen = Object.create(null); expanded = Object.create(null);
  tbody.innerHTML = '';
  loadedOnce = true;
  updateEmpty();
});

/* ---------- 轮询 + SSE + 退避 ---------- */
var backoff = 1000;                        // fetch 失败指数退避，上限 30s；不打断已渲染列表
function setConn(bad){ connBox.hidden = !bad; }
function bumpBackoff(){ backoff = Math.min(backoff * 2, 30000); }
function resetBackoff(){ backoff = 1000; }

/* 低频拉一次后端清单（worker -> gpu）；GPU 标签晚到时需要整表重建让提供方列跟上 */
function refreshBackends(force){
  var now = Date.now();
  if (!force && now - lastBackendsAt < 30000) return;
  lastBackendsAt = now;
  fetchJson('./logs/backends').then(function(r){
    var next = Object.create(null);
    var changed = false;
    (r && Array.isArray(r.backends) ? r.backends : []).forEach(function(b){
      if (!b || !b.url) return;
      var url = b.url.replace(/^https?:\/\//, '').replace(/\/+$/, '');
      var gpu = b.gpu == null ? null : String(b.gpu);
      if (!backends[url]) changed = true;      // 新 worker 出现：提供方列要换口径
      else if (backends[url].gpu !== gpu) changed = true;   // GPU 标签晚到/变化
      next[url] = { gpu: gpu };
    });
    backends = next;
    if (changed && rows.length) rebuild();   // GPU 信息到位/变化，刷新提供方列
  }, function(){ /* 拉不到维持旧表，下次再试 */ });
}

function tick(){
  refreshBackends(false);
  Promise.all([fetchJson('./logs?cursor=' + cursor + '&limit=1000'), fetchJson('./stats')])
    .then(function(res){
      setConn(false); resetBackoff();
      var logs = res[0], st = res[1];
      if (logs && Array.isArray(logs.requests)) {
        if (st && typeof st.started_at_ms === 'number' && startedAtMs !== null && st.started_at_ms !== startedAtMs) {
          // 网关重启：环形缓冲重建（seq 归零），旧 cursor 与旧 SSE 连接全部作废
          resetAll(st.started_at_ms);
          reopenStream();
          fetchJson('./logs?cursor=0&limit=1000').then(function(fresh){   // 旧 cursor 拉不回重置后的缓冲，补拉一次
            if (fresh && Array.isArray(fresh.requests)) ingest(fresh.requests);
          }, function(){ /* 下轮轮询继续兜底 */ });
          return;
        }
        ingest(logs.requests);
        if (typeof logs.capacity === 'number') capacity = logs.capacity;
      }
      if (st) applyStats(st);
      loadedOnce = true;
      updateEmpty();
    })
    .catch(function(){ setConn(true); bumpBackoff(); });
}
function fetchJson(url){
  return fetch(url, { cache: 'no-store' }).then(function(r){
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  });
}
var capacity = 1000;
function applyStats(s){
  stats = s;
  if (typeof s.started_at_ms === 'number') {
    if (startedAtMs === null) startedAtMs = s.started_at_ms;
  }
  document.getElementById('s-inflight').textContent = s.inflight === undefined ? '-' : s.inflight;
  document.getElementById('s-out').textContent = num(s.output_tok_s) === null ? '-' : Math.round(s.output_tok_s);
  document.getElementById('s-in').textContent = num(s.input_tok_s) === null ? '-' : Math.round(s.input_tok_s);
  document.getElementById('s-req').textContent = (s.requests_window === undefined ? '-' : s.requests_window) +
    ' / ' + (s.errors_window === undefined ? '-' : s.errors_window);
  document.getElementById('s-ttft').textContent = num(s.avg_ttft_ms) === null ? '-' : Math.round(s.avg_ttft_ms) + 'ms';
  document.getElementById('s-up').textContent = num(s.uptime_s) === null ? '-' : fmtUptime(s.uptime_s);
  var buffered = typeof s.buffered === 'number' ? s.buffered : rows.length;
  capacity = typeof s.capacity === 'number' ? s.capacity : capacity;
  bufBox.textContent = buffered + '/' + capacity;
}
function resetAll(newStartedAt){
  rows = []; seen = Object.create(null); cursor = 0; expanded = Object.create(null);
  tbody.innerHTML = '';
  startedAtMs = newStartedAt;
  loadedOnce = false;
}

/* SSE：低延迟追加；断线由 EventSource 自动重连，同时轮询仍是权威来源 */
var es = null;
function openStream(){
  if (typeof EventSource !== 'function') return;                 // 极老浏览器降级为纯轮询
  try {
    es = new EventSource('./logs/stream');
    es.onmessage = function(ev){
      try {
        var r = JSON.parse(ev.data);
        if (r && typeof r.seq === 'number') ingest([r]);
      } catch (e) { /* 单帧解析失败忽略，不影响列表 */ }
    };
    es.onerror = function(){ /* EventSource 自带重连；轮询兜底，故不额外处理 */ };
  } catch (e) { es = null; }
}
/* 网关重启后旧连接里的 seq 已失去意义（会与新缓冲撞号），必须断开重建 */
function reopenStream(){
  if (es) { try { es.close(); } catch (e) {} es = null; }
  openStream();
}

/* 1s 节拍：定时器间隔取 max(POLL_MS, backoff)，退避期间自动放慢，不冲击后端 */
function schedule(){
  tick();
  setTimeout(schedule, Math.max(POLL_MS, backoff));
}
openStream();
schedule();
window.addEventListener('beforeunload', function(){ if (es) es.close(); });
</script>
<script defer src="./lmr-tabs.js" data-active="logs"></script>
</body>
