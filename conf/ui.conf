# Routing policy (doc/gap-routing-dyn.md): GET answers the chain document,
# PUT/POST applies {policy, model_policies, model_policy}. Method gating matches
# axum (get + put); a wrong method answers 405 with Allow, like the other groups.
location = /_ui/config/policy {
    client_max_body_size 8m;
    content_by_lua_block {
        local ui = require("resty.luarouter.ui")
        local method = ngx.req.get_method()
        if method == "GET" or method == "HEAD" then
            ui.method_any("GET", "HEAD")
            ui.config_policy_get()
        elseif method == "PUT" or method == "POST" then
            ui.method_any("PUT", "POST")
            ui.config_policy()
        else
            ui.method_any("GET", "PUT")
        end
    }
}
location = /_ui/config/apply {
    client_max_body_size 8m;
    content_by_lua_block {
        local ui = require("resty.luarouter.ui")
        ui.method_only("POST")
        ui.config_apply()
    }
}
location = /_ui/config/model-map {
    client_max_body_size 8m;
    content_by_lua_block {
        local ui = require("resty.luarouter.ui")
        ui.method_only("POST")
        ui.config_model_map()
    }
}

# ── Static SPA ───────────────────────────────────────────────────────────────
# Directory comes from env LMR_UI_DIR (default /usr/local/share/llama-ui).
# Real-time gzip only: the bundle ships no .br/.gz siblings, so brotli_static /
# gzip_static would either 404 on a prefetch or advertise the wrong encoding.
location = /_ui {
    return 301 /_ui/;
}
location ^~ /_ui/ {
    set_by_lua_block $lmr_ui_root {
        local ok, store = pcall(require, "resty.luarouter.config_store")
        local dir = ok and store and store.env("LMR_UI_DIR") or os.getenv("LMR_UI_DIR")
        if dir == nil or dir == "" then dir = "/usr/local/share/llama-ui" end
        return (dir:gsub("/+$", "")) .. "/"
    }
    alias $lmr_ui_root;
    index index.html;
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types application/javascript application/json application/manifest+json
               image/svg+xml text/css text/javascript text/plain;
}
