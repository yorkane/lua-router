# Standalone syntax/behaviour conf for the Lua router, modelled on
# authz/test/conf/nginx-klib.conf. Mount the repo at /repo and run:
#
#   docker run --rm -v /path/to/lua-router:/repo:ro \
#     --entrypoint openresty authz:latest \
#     -t -p /usr/local/openresty/nginx/ \
#     -c /repo/test/conf/nginx-lua-router.conf
#
# Serve it (the authz entrypoint starts its own nginx on 6080, so override it):
#
#   docker run -d --name lrtest --entrypoint openresty \
#     -v /path/to/lua-router:/repo:ro -p 127.0.0.1::8080 \
#     authz:latest -p /usr/local/openresty/nginx/ \
#     -c /repo/test/conf/nginx-lua-router.conf -g 'daemon off;'
#   docker port lrtest 8080   # host side of the mapping
#
# The listener is 8080 to match that convention.
#
# klib.* resolves from the authz image's own site/lualib; luarouter resolves
# from the repo checkout so edits are live without rebuilding.


# OpenTelemetry 追踪（doc/gap-otel.md）：otel.lua 在 init 阶段抓取这组开关，conf 三处
# 同样声明，这样 worker 里的 os.getenv / /probe/otel 也能读到。SMG_ENABLE_TRACE 默认
# 关闭；SMG_OTLP_TRACES_ENDPOINT 这里走的是 OTLP/HTTP JSON（默认 4318），与 Rust 的
# OTLP gRPC（默认 localhost:4317）只差在传输层，W3C 上下文与 span 字段是对齐的。
env SMG_ENABLE_TRACE;
env SMG_OTLP_TRACES_ENDPOINT;
env SMG_TRACE_BATCH_SIZE;
env SMG_TRACE_BATCH_INTERVAL_MS;
env SMG_TRACE_TIMEOUT_MS;
env SMG_TRACE_SAMPLE_RATIO;
env SMG_TRACE_MAX_QUEUE;
env SMG_TRACE_UPSTREAM_CHILD;

# 在途请求年龄采样器（doc/gap-inflight-age.md）：LR_INFLIGHT_SAMPLE_SECS /
# LR_INFLIGHT_TTL_SECS 在 init_by_lua 里 fork 之前抓取（init.lua wire_inflight_tracker），
# worker 环境随后被 nginx 重建，所以这两个名字也要在 env 白名单里声明一遍，规则同上面的
# SMG_ENABLE_TRACE。两个都可省略：默认按 Rust 的 20 s 采样、槽位 TTL 3600 s。
env LR_INFLIGHT_SAMPLE_SECS;
env LR_INFLIGHT_TTL_SECS;


worker_processes 1;
error_log stderr notice;
pid /tmp/lua-router-nginx.pid;

events { worker_connections 64; }

http {
    # Absolute path: these two files are also parsed with -c from a directory that
    # is not the nginx conf prefix (the conf gate mounts the repo at /repo), and a
    # relative `mime.types` then resolves against the config's own directory.
    include       /usr/local/openresty/nginx/conf/mime.types;
    types {
        application/manifest+json webmanifest;
        text/javascript mjs;
    }
    lua_package_path "/repo/lualib/?.lua;/repo/lualib/?/init.lua;/repo/../lualib/?.lua;/repo/../lualib/?/init.lua;/usr/local/openresty/site/lualib/?.lua;/usr/local/openresty/site/lualib/?/init.lua;/usr/local/openresty/lualib/?.lua;/usr/local/openresty/lualib/?/init.lua;;";

    lua_socket_log_errors off;

    lua_shared_dict lr_workers     2m;
    lua_shared_dict lr_policy     20m;
    lua_shared_dict lr_stats       5m;
    lua_shared_dict lr_request_log 20m;
    lua_shared_dict lr_locks       1m;
    lua_shared_dict lr_limit      64k;
    lua_shared_dict luarouter_config 1m;

    resolver 127.0.0.11 ipv6=off valid=30s;
    resolver_timeout 5s;

    client_max_body_size 512m;
    client_body_buffer_size 4m;

    init_by_lua_block {
        require("resty.luarouter").init()
    }

    init_worker_by_lua_block {
        require("resty.luarouter").worker_init()
    }

    log_by_lua_block {
        require("resty.luarouter").on_log()
    }

    server {
        listen 8080;

        # 预检在 rewrite 阶段应答：nginx 还没选 location 就先跑 server 级 rewrite，
        # 于是 ui.conf 那些自带方法门的 /_ui/* 也能吃到统一的 CORS 预检（与 Rust
        # 的 CorsLayer 最外层等价）。
        rewrite_by_lua_block {
            if require("resty.luarouter.router").preflight_guard() then
                return ngx.exit(200)
            end
        }
        server_name localhost;

        # Everything the router serves goes through its own klib.router.
        location / {
            content_by_lua_block {
                require("resty.luarouter.router").handle()
            }
        }


        # The /_ui surface (API aliases plus the static SPA), same include the
        # entrypoint generates. Exact locations outrank `location /`, so the
        # router keeps everything it owns (/_ui/logs and friends are also in its
        # route table for deployments that skip ui.conf).
        include /repo/conf/ui.conf;

        # Load-only probe: require each module and report per-module status, so
        # a syntax error names the file instead of failing the whole config.
        location = /klib/load {
            default_type text/plain;
            content_by_lua_block {
                local modules = {
                    "resty.luarouter", "resty.luarouter.config",
                    "resty.luarouter.registry", "resty.luarouter.hb",
                    "resty.luarouter.policy", "resty.luarouter.observability",
                    "resty.luarouter.router", "klib.router", "klib.ctxvar",
                    "resty.luarouter.ui", "resty.luarouter.props",
                    "resty.luarouter.config_store", "resty.luarouter.hash",
                    "resty.luarouter.limit",
                    "resty.luarouter.policies.tree",
                    "resty.luarouter.policies.utils",
                    "resty.luarouter.policies.cache_aware",
                    "resty.luarouter.policies.bucket",
                    "resty.luarouter.policies.consistent_hashing",
                    "resty.luarouter.policies.prefix_hash",
                    "resty.luarouter.mesh",
                }
                for _, name in ipairs(modules) do
                    local ok, result = pcall(require, name)
                    ngx.say(name .. ": " .. (ok and "OK" or ("FAIL - " .. tostring(result))))
                end
            }
        }

        # Pure-function probes (only request-header state is needed).
        location = /probe/worker-id {
            default_type text/plain;
            content_by_lua_block {
                local registry = require "resty.luarouter.registry"
                local url = ngx.var.arg_url or "http://127.0.0.1:18000"
                ngx.say(registry.worker_id_for_url(url))
            }
        }

        location = /probe/rewrite-model {
            default_type text/plain;
            content_by_lua_block {
                local router = require "resty.luarouter.router"
                local body = '{"model":"alias-a","messages":[{"role":"user","content":"m"}]}'
                ngx.say(router.rewrite_model(body, "real/model-1"))
            }
        }

        location = /probe/extract-text {
            default_type application/json;
            content_by_lua_block {
                local router = require "resty.luarouter.router"
                local cjson = require "cjson.safe"
                local body = cjson.decode([[{"messages":[
                    {"role":"system","content":"sys"},
                    {"role":"user","content":[{"type":"text","text":"a"},{"type":"image_url","image_url":{"url":"x"}}]},
                    {"role":"assistant","content":"prev","reasoning_content":"think"},
                    {"role":"tool","content":"toolout"},
                    {"role":"function","content":"funcout"}]}]])
                ngx.say(cjson.encode({
                    chat = router.text_extractors["/v1/chat/completions"](body),
                    completions = router.text_extractors["/v1/completions"]
                        ({ prompt = { "p1", "p2" } }),
                }))
            }
        }

        location = /probe/headers {
            default_type application/json;
            content_by_lua_block {
                local router = require "resty.luarouter.router"
                local cjson = require "cjson.safe"
                local keep, drop = {}, {}
                local names = {
                    "authorization", "x-request-id", "x-correlation-id", "traceparent",
                    "tracestate", "x-smg-routing-key", "x-smg-target-worker",
                    "x-request-id-retry", "content-type", "cookie", "host", "accept",
                }
                for i = 1, #names do
                    if router.should_forward_request_header(names[i]) then
                        keep[#keep + 1] = names[i]
                    else
                        drop[#drop + 1] = names[i]
                    end
                end
                local dropped = {}
                for name in pairs(router.DROP_RESPONSE_HEADERS) do
                    dropped[#dropped + 1] = name
                end
                table.sort(dropped)
                ngx.say(cjson.encode({ keep = keep, drop = drop, response_drop = dropped }))
            }
        }

        # Environment visibility probe: nginx clears the worker environment
        # (only TZ/HOME/PATH plus declared `env` directives survive the fork),
        # so LMR_* must be snapshotted in init_by_lua via config_store.capture_env.
        location = /probe/env {
            default_type application/json;
            content_by_lua_block {
                local cjson = require "cjson.safe"
                local store = require "resty.luarouter.config_store"
                ngx.say(cjson.encode({
                    raw = os.getenv("LMR_VIRTUAL_MODELS"),
                    cached_before = (_G.LMR_ENV_CACHE ~= nil),
                    home = os.getenv("HOME"),
                }))
            }
        }

        location = /probe/available {
            default_type text/plain;
            content_by_lua_block {
                local registry = require "resty.luarouter.registry"
                local id = registry.worker_id_for_url(ngx.var.arg_url
                    or "http://127.0.0.1:18005")
                local before = registry.cb_state(id)
                local avail = registry.is_available(id)
                local after = registry.cb_state(id)
                ngx.say("id=", id)
                ngx.say("arg_url=", tostring(ngx.var.arg_url))
                ngx.say("before=", before.state_name, " opened_at=", before.opened_at_ms,
                    " fails=", before.consecutive_failures)
                ngx.say("available=", tostring(avail))
                ngx.say("after=", after.state_name, " opened_at=", after.opened_at_ms)
            }
        }

        # Policy factory probe: which instance the framework built, whether the
        # standalone module loaded, and what the tree snapshot looks like in
        # lr_policy. Used by the integration tests (doc/impl-integration.md).
        location = /probe/policy {
            default_type application/json;
            content_by_lua_block {
                local cjson = require "cjson.safe"
                local policy_mod = require "resty.luarouter.policy"
                local inst = policy_mod.default or policy_mod.new(require("resty.luarouter").config())
                local out = {
                    requested = require("resty.luarouter").config().policy,
                    name = inst:policy_name(),
                    standalone = inst.impl ~= nil,
                    needs_request_text = inst:needs_request_text(),
                    seeded = inst.seeded or false,
                    generation = policy_mod.generation(),
                }
                if inst.impl then
                    local trees = inst.impl.trees
                    if trees then
                        out.trees = {}
                        out.chars = {}
                        for key, tree in pairs(trees) do
                            out.trees[key] = tree:node_count()
                            local total = 0
                            for _, n in pairs(tree:get_tenant_char_count()) do
                                total = total + n
                            end
                            out.chars[key] = total
                        end
                    end
                    out.snapshot_key = inst:snapshot_key()
                    local snap = ngx.shared.lr_policy:get(inst:snapshot_key())
                    out.snapshot_bytes = snap and #snap or cjson.null
                end
                local keys = ngx.shared.lr_policy:get_keys(0)
                local stored = {}
                for _, k in ipairs(keys) do
                    if k:sub(1, 9) == "snapshot:" then
                        stored[k] = #ngx.shared.lr_policy:get(k)
                    end
                end
                out.snapshots = stored
                ngx.say(cjson.encode(out))
            }
        }

        # Raw JSON member editor: proves the effort/ctx edits keep the rest of the
        # document byte-identical (a cjson re-encode cannot promise that).
        location = /probe/json-edit {
            default_type application/json;
            content_by_lua_block {
                local cjson = require "cjson.safe"
                local router = require "resty.luarouter.router"
                local raw = '{'
                    .. '"model":"m", "tools":[{"type":"function"}],'
                    .. '"nested":{"model":"keep"},'
                    .. '"reasoning_effort":"low", "max_tokens":99999}'
                local added = router.set_top_field(raw, "user", "u1")
                local out = {
                    raw = raw,
                    set_string = router.set_top_field(raw, "reasoning_effort", "high"),
                    set_number = router.set_top_field(raw, "max_tokens", 128),
                    add = added,
                    remove = router.set_top_field(raw, "reasoning_effort", nil),
                    remove_only = router.set_top_field(
                        '{"reasoning_effort":"low"}', "reasoning_effort", nil),
                    empty_object = router.set_top_field("{}", "model", "m"),
                    keep_nested = added:find('"nested":{"model":"keep"}', 1, true) ~= nil,
                    keep_tools = added:find('"tools":[{"type":"function"}]', 1, true) ~= nil,
                    -- Regression for the field_pattern number branch: the
                    -- optional exponent group (?:[eE][-+]?[0-9]+) without its
                    -- trailing `?` fails to match a plain integer member, so
                    -- set_top_field appends instead of replacing and emits a
                    -- duplicate "max_tokens" key (LMR_MODEL_CTX then never
                    -- caps explicit max_tokens requests).
                    replace_int_members = (function()
                        local replaced = router.set_top_field(
                            '{"max_tokens":128,"n":1}', "max_tokens", 99999)
                        local count = 0
                        for _ in string.gmatch(replaced, '"max_tokens"') do
                            count = count + 1
                        end
                        local parsed = cjson.decode(replaced)
                        return count == 1 and type(parsed) == "table"
                            and parsed.max_tokens == 99999 and parsed.n == 1
                    end)(),
                }
                local decodes = {}
                for key, value in pairs(out) do
                    if type(value) == "string" and value ~= raw then
                        decodes[key] = cjson.decode(value) ~= nil
                    end
                end
                out.decodes = decodes
                ngx.say(cjson.encode(out))
            }
        }

        # M5: the streaming usage scanner must find a usage frame that is cut
        # mid-object across two reads and sits behind more than 64KB of stream
        # (the tail window slides, so a naive whole-tail scan would have to be
        # re-run; the incremental scanner must still land on the frame). Drives
        # the real stream_response with a scripted cosocket, Content-Length
        # framing, small read sizes. The verdict is the last line of the body.
        location = /probe/stream-usage {
            content_by_lua_block {
                local router = require "resty.luarouter.router"
                local frames = {
                    'data: {"id":"c","choices":[{"delta":{"content":"a"}}]}\n\n',
                    'data: {"id":"c","choices":[{"delta":{"content":"b"}}]}\n\n',
                    'data: {"id":"c","pad":"' .. string.rep("y", 70000)
                        .. ',' .. string.rep("y", 70000) .. '"}\n\n',
                    -- usage frame split into three reads, mid-object
                    'data: {"id":"c","choices":[{"finish_reason":"stop"}],"usa',
                    'ge":{"prompt_',
                    'tokens":11,"completion_tokens":22,"total_tokens":33}}\n\n',
                    "data: [DONE]\n\n",
                }
                local total = 0
                for i = 1, #frames do total = total + #frames[i] end

                local index, offset = 1, 1
                local sock = {}
                sock.receive = function(self, size)
                    while index <= #frames and offset > #frames[index] do
                        index = index + 1
                        offset = 1
                    end
                    if index > #frames then return nil end
                    local text = frames[index]
                    local take = math.min(size, #text - offset + 1)
                    local out = text:sub(offset, offset + take - 1)
                    offset = offset + take
                    return out
                end
                sock.close = function() end
                sock.setkeepalive = function() end

                local ok, tail, prompt, completion, cached =
                    router.stream_response(sock, { ["content-length"] = tostring(total) })
                -- 4096-byte reads over ~140KB of stream => ~35 scans, and the
                -- first two usage-bearing reads are partial.
                local verdict = "PROBE ok=" .. tostring(ok)
                    .. " prompt=" .. tostring(prompt)
                    .. " completion=" .. tostring(completion)
                    .. " cached=" .. tostring(cached)
                    .. " tail=" .. #tostring(tail)
                ngx.say(verdict)
            }
        }

        # 在途年龄 tracker 的关闭态回归探针（doc/gap-inflight-age.md）：手动往
        # lr_stats 塞一份"开关拨到 0 之前留下的" age 直方图与槽位，再渲染 /metrics。
        # 关闭态必须整条家族缺席——包括这些残留 key。曾经 string.find(..., "^…", 1, true)
        # 把脱字符当字面量，过滤分支是死代码；这条探针就是为了钉住那个修法。
        location = /probe/inflight-off {
            default_type application/json;
            content_by_lua_block {
                local cjson = require "cjson.safe"
                local obs = require "resty.luarouter.observability"
                local d = ngx.shared.lr_stats
                -- Side-effect free: save what is there and put it back, so the
                -- probe can be called mid-section without disturbing the drain
                -- assertions that follow.
                local HIST_KEY, SLOT_KEY = "h|smg_http_inflight_request_age_count|", "i|7"
                local saved_hist = d:get(HIST_KEY)
                local saved_slot = d:get(SLOT_KEY)
                d:set(HIST_KEY, cjson.encode({ n = 7, s = 42, b = { [10] = 7 } }))
                d:set(SLOT_KEY, tostring(ngx.now() * 1000) .. "|deadbeef", 60)
                local text = obs.prometheus_text()
                if saved_hist then d:set(HIST_KEY, saved_hist) else d:delete(HIST_KEY) end
                if saved_slot then d:set(SLOT_KEY, saved_slot) else d:delete(SLOT_KEY) end
                ngx.say(cjson.encode({
                    enabled = obs.inflight_enabled(),
                    histogram_rendered =
                        string.find(text, "smg_http_inflight_request_age_count", 1, true) ~= nil,
                    slots_rendered =
                        string.find(text, "smg_http_inflight_request_age_slots_active", 1, true) ~= nil,
                    duration_still_rendered =
                        string.find(text, "smg_http_request_duration_seconds", 1, true) ~= nil,
                }))
            }
        }

        location = /probe/config {
            default_type application/json;
            content_by_lua_block {
                local cjson = require "cjson.safe"
                ngx.say(cjson.encode(require("resty.luarouter").config()))
            }
        }
    }
}
