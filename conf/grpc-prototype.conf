# ============================================================================
# lua-router gRPC 原型片段（grpc_proxy.lua 的 nginx 侧接线）
# ============================================================================
# 这不是完整配置：它是要被 include 进 http{} / server{} 的两段片段，用来把
# resty.luarouter.grpc_proxy 选出来的 worker 交给 ngx_http_grpc_module 转发。
# 生产接线按 doc/gap-grpc-pd.md 的步骤并入 nginx.conf.template。
#
# 实证环境（本机 authz:latest，OpenResty 1.31.1.1 / nginx 1.31.1）：
#   * 二进制含 ngx_http_grpc_module、grpc_pass、grpc_read_timeout、grpc_ssl_* 符号；
#     nginx 默认编译该模块，configure 参数里没有 --without-http_grpc_module
#   * grpc_pass 只能写在 location{}：写在 server{} 里
#     => "grpc_pass" directive is not allowed here
#   * grpc_pass 原样转发 :path（不像 proxy_pass 会去前缀），所以带前缀的 location
#     必须 rewrite ... break 剥掉前缀，否则后端回 UNIMPLEMENTED "Method not found!"
#   * 后端可写变量（grpc_pass grpc://$var）或 upstream + balancer_by_lua，两者都
#     每请求生效一次（实测 25 次请求 = 25 次 balancer 调用）
#   * set_current_peer 只接受 IP 字面量，域名报 "no host allowed"
#     => 域名 worker 走变量式 grpc_pass（由 http{} 的 resolver 解析）
#   * 上游不做 HTTP/2 多路复用：100 个并发调用 = 100 条到后端的 TCP 连接，
#     upstream keepalive 对 gRPC 无收益
#
# 语法 gate：
#   docker run --rm -v "$PWD:/repo:ro" --entrypoint openresty authz:latest \
#     -t -p /usr/local/openresty/nginx/ -c /repo/conf/grpc-prototype.conf
# 直接起（宿主网络，mock 在 127.0.0.1:19600/19602）：
#   docker run --rm --network host -v "$PWD:/repo:ro" \
#     --entrypoint /usr/local/openresty/bin/openresty authz:latest \
#     -p /usr/local/openresty/nginx -c /repo/conf/grpc-prototype.conf \
#     -g 'daemon off;'

worker_processes 1;
user root;
error_log /dev/stderr warn;
pid logs/grpc-prototype.pid;

events { worker_connections 1024; }

http {
    default_type application/octet-stream;

    # grpc_proxy.lua 在仓库里的位置；镜像内是 /usr/local/openresty/site/lualib
    lua_package_path "/repo/lualib/?.lua;;";

    # 变量式 grpc_pass 需要它；容器里的 Docker DNS 是 127.0.0.11
    resolver 127.0.0.11 1.1.1.1 ipv6=off valid=10s;
    resolver_timeout 2s;

    # 每次转发的落点，动态选 worker 的证据就写在这里
    log_format grpc '$remote_addr $request "worker=[$lr_grpc_worker] pool=[$lr_grpc_pool] '
                    '"peer=[$upstream_addr]" grpc-status=[$upstream_http_grpc_status] '
                    'status=$status rt=$request_time';
    access_log /dev/stderr grpc;

    # IP 字面量 fleet 可选这条路：balancer_by_lua 逐请求落点。
    # 注意 keepalive 对 gRPC 上游无意义（每调用一条连接），因此不写。
    upstream lr_grpc {
        server 0.0.0.1;
        balancer_by_lua_block {
            local grpc_proxy = require "resty.luarouter.grpc_proxy"
            local ok, err = grpc_proxy.balancer()
            if not ok then
                ngx.log(ngx.ERR, "lr-grpc balancer: ", err)
                return ngx.exit(ngx.HTTP_BAD_GATEWAY)
            end
        }
    }

    server {
        listen 127.0.0.1:19500;
        http2 on;

        # grpc_proxy.setup() 写、下面各指令读的运行期变量。
        # 变量式 grpc_pass 用 lr_grpc_scheme + lr_grpc_peer；域名 worker 由上面的
        # resolver 解析（实测 p50 0.9ms vs IP 字面量 0.8ms，resolver 有缓存）。
        # 只有走 balancer_by_lua 时才需要 lr_grpc_host / lr_grpc_port。
        # setup() 对未声明的变量是跳过的，所以只保留需要的那几个也行。
        set $lr_grpc_worker "";
        set $lr_grpc_pool   "";
        set $lr_grpc_scheme "grpc";
        set $lr_grpc_peer   "";
        set $lr_grpc_timeout "";

        client_max_body_size 512m;   # 与 Rust DefaultBodyLimit / MAX_PAYLOAD_SIZE 一致
        grpc_read_timeout 1800s;     # 长生成不掐断；真正的上限由 grpc-timeout 决定

        # gRPC 推理面：/generate /chat /v1/... 之类的 sglang gRPC 方法
        location / {
            access_by_lua_block {
                local grpc_proxy = require "resty.luarouter.grpc_proxy"
                local pd = require "resty.luarouter.pd"
                local headers = ngx.req.get_headers()

                -- 原型期的 worker 表：生产环境换成 registry.records() +
                -- router.candidates_for()，选择逻辑本身不变。
                local records = {
                    { id = "p1", url = "http://127.0.0.1:19600",
                      worker_type = "prefill", labels = { grpc_port = 19600 } },
                    { id = "p2", url = "http://127.0.0.1:19602",
                      worker_type = "prefill", labels = { grpc_port = 19602 } },
                    { id = "d1", url = "http://127.0.0.1:19600",
                      worker_type = "decode", labels = { grpc_port = 19600 } },
                }
                local is_available = function(w) return w.healthy ~= false end

                local pair, err = pd.select_pair(records, {
                    select = function(candidates, pool)
                        -- 生产：policy_for(model):select{candidates=candidates,...}
                        local want = headers["x-lr-worker"]
                        for i = 1, #candidates do
                            if want and candidates[i].id == want then
                                return candidates[i]
                            end
                        end
                        return candidates[1]
                    end,
                    is_available = is_available,
                })
                if not pair then
                    -- 双池不齐时 PD 不可用；原型直接按错误码回 gRPC 状态
                    local code = (err == pd.ERR_NO_PREFILL) and 14
                        or (err == pd.ERR_NO_DECODE) and 14 or 12
                    ngx.status = 200
                    ngx.header["content-type"] = "application/grpc"
                    ngx.header["grpc-status"] = code
                    ngx.header["grpc-message"] = err or "pd selection failed"
                    return ngx.exit(200)
                end

                -- 真正被 grpc_pass 使用的那个 worker（prefill 侧）
                local ok, serr = grpc_proxy.setup(pair.prefill, {
                    timeout_secs = 1800,
                    headers = headers,
                })
                if not ok then
                    ngx.log(ngx.ERR, "lr-grpc setup: ", serr)
                    return ngx.exit(ngx.HTTP_BAD_GATEWAY)
                end
                ngx.var.lr_grpc_worker = pair.prefill.id
                ngx.var.lr_grpc_pool = pd.POOL_PREFILL
                -- decode 侧的选择结果留给 PD 双发接线（见 doc/gap-grpc-pd.md）
                ngx.req.set_header("x-lr-decode", pair.decode.id)
            }

            # nginx 不会自己给上游加 te: trailers，而后端只有见到它才发 trailer；
            # 少了这一行 grpc 客户端拿到 502。
            grpc_set_header TE "trailers";
            grpc_set_header grpc-timeout $lr_grpc_timeout;
            grpc_set_header x-lr-worker $lr_grpc_worker;

            # 变量式：scheme 与 peer 都由 Lua 决定，TLS worker 自动切 grpcs
            grpc_pass $lr_grpc_scheme://$lr_grpc_peer;
        }
    }
}
