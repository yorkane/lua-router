# ── /_ui/ — llama.cpp webui: static assets + API aliases (lua-router) ────────
#
# Include this fragment inside the http server block:
#     include /usr/local/openresty/nginx/conf/lua-router/ui.conf;
# (tests use an absolute path into the repo). Every API path is an exact `=`
# location so it outranks the ^~ static prefix below; the config/logs handlers
# must NOT be prefix locations or they would eat config.html / logs.html.
#
# Parity target: gateway/src/server.rs ui_api_routes() + ui_logs_routes() +
# ui_config_routes() + the ServeDir mount. Handlers live in
# resty.luarouter.ui (aliases), .props, .config_store, .observability.
#
# Auth: none. The whole gateway auth surface was removed (doc/scope-trim.md),
# so every /_ui alias is open here - which is also how Rust leaves the
# ui_logs_routes / ui_config_routes groups and the ServeDir SPA mount. The
# trust boundary is the edge (authz) or the network, not this file.

# Chat traffic: same pipeline as /v1/... (metrics, IGW routing in core).
# 512m matches the Rust DefaultBodyLimit (config default max_payload_size).
location = /_ui/v1/chat/completions {
    client_max_body_size 512m;
    content_by_lua_block {
        local ui = require("resty.luarouter.ui")
        ui.method_only("POST")
        ui.chat()
    }
}
location = /_ui/v1/completions {
    client_max_body_size 512m;
    content_by_lua_block {
        local ui = require("resty.luarouter.ui")
        ui.method_only("POST")
        ui.completion()
    }
}

