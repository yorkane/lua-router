# ── /u/ 静态入口与 302 · /a 兼容 302（admin 静态在 nginx.conf.template 的 `location /`）────
# webui 与 admin 共用同一个 UI 根（LMR_UI_DIR，admin 就住在 <root>/admin/）：/u/ 用
# alias 指向 <root>/，根路径用 root 指向 <root>/admin/（后者在 nginx.conf.template）。
# 静态只做实时 gzip：bundle 不带 .br/.gz 兄弟文件，gzip_static 会对预取 404。
# exact /u 补没有尾斜杠的入口：alias 前缀块会把 /u 当成目录而 404，所以显式
# 302 到 /u/（同 /a 的形状：no-store + 相对引用，理由见文件末尾的 /a 块注释）。
location = /u {
    absolute_redirect off;
    add_header Cache-Control "no-store";
    return 302 /u/;
}
# webui 的规范入口。^~ 让静态前缀排在正则之前；/u/ 下的 API 名字全部由上面的
# exact location 接走（exact 优先于 ^~），所以这里只会答磁盘上的静态文件。
# /u/admin/... 与根路径指向同一批文件（webui 根与 admin 根重叠：admin 就住在
# <LMR_UI_DIR>/admin/）。把 /u/admin/ 整棵 302 到 /（2026-10-08 admin 迁根，
# /a/ 已不再是管理台），管理台只留根一个可书签入口。^~ /u/admin/ 比 ^~ /u/ 更长
# 所以被优先选中；/u/ 下的 API 名字全部由上面的 exact location 接走
# （exact 优先于 ^~），不受影响。
location ^~ /u/admin/ {
    absolute_redirect off;
    add_header Cache-Control "no-store";
    rewrite ^/u/admin/(.*)$ /$1 redirect;
}
location ^~ /u/ {
    absolute_redirect off;
    set_by_lua_block $lmr_u_root {
        local ok, store = pcall(require, "resty.luarouter.config_store")
        local dir = ok and store and store.env("LMR_UI_DIR") or os.getenv("LMR_UI_DIR")
        if dir == nil or dir == "" then dir = "/usr/local/share/llama-ui" end
        return (dir:gsub("/+$", "")) .. "/"
    }
    alias $lmr_u_root;
    index index.html;
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types application/javascript application/json application/manifest+json
               image/svg+xml text/css text/javascript text/plain;
}
# /a 与 /a/ —— 管理台旧入口的兼容 302（用户裁定 2026-10-08：admin 迁根）。管理台
# 静态现在只由 conf/nginx.conf.template 的 `location /` 提供（root 固定落到
# <LMR_UI_DIR>/admin/），所以这两条 exact 各自 302 到 /。形状沿用迁根之前：
# absolute_redirect off + 相对引用，因为在 TLS 终结边缘（authz/APISIX）之后 nginx
# 看到的 Host 是 upstream 地址，绝对 Location 会把浏览器甩出隧道；no-store 是因为
# 浏览器会持久化重定向缓存——一条错的 Location 会活过修复。
location = /a {
    absolute_redirect off;
    add_header Cache-Control "no-store";
    return 302 /;
}
location = /a/ {
    absolute_redirect off;
    add_header Cache-Control "no-store";
    return 302 /;
}
