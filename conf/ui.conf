# Config page API (handlers in config_store.lua). Exact paths keep the static
# config.html reachable.
location = /_ui/config {
    client_max_body_size 8m;
    content_by_lua_block {
        local ui = require("resty.luarouter.ui")
        ui.method_any("GET", "POST")
        -- axum's get(handler) answers HEAD with the GET route, so HEAD belongs on
        -- the read side here. method_any already folds HEAD into GET for the gate,
        -- and a GET branch keyed on the literal method let HEAD fall through to the
        -- POST handler, whose empty body is rejected with 400.
        local method = ngx.req.get_method()
        if method == "GET" or method == "HEAD" then
            ui.config_get()
        else
            ui.config_effort()
        end
    }
}
location = /_ui/config/effort {
    client_max_body_size 8m;
    content_by_lua_block {
        local ui = require("resty.luarouter.ui")
        ui.method_only("POST")
