# ── Static SPA ───────────────────────────────────────────────────────────────
# Directory comes from env LMR_UI_DIR (default /usr/local/share/llama-ui).
# Real-time gzip only: the bundle ships no .br/.gz siblings, so brotli_static /
# gzip_static would either 404 on a prefetch or advertise the wrong encoding.
location = /_ui {
    # absolute_redirect off: behind a TLS-terminating edge (authz/APISIX, e.g.
    # https://8800-235.ai-t.wtvdev.com) the Host the router sees is the upstream
    # address, so nginx would build Location: http://127.0.0.1:8800/... from it
    # and dump the browser outside the tunnel. A relative reference (RFC 9110
    # 10.2.2) is resolved by the client against its own scheme/host, which is
    # exactly the address the edge gave it. Same reason on the index redirect
    # below (/_ui/admin -> /a/).
    absolute_redirect off;
    return 302 /u/;
}
# Console entry (doc/refactor-arch-2026-10-05.md §5.3): the Quasar admin console
# now lives under /a/. /_ui/admin answers the exact redirect; every deeper
# /_ui/admin/<page> request is 302'd to the same path under /a/ (rewrite ...
# redirect + absolute_redirect off keeps the Location a relative reference for
# the TLS-terminating edge, and no-store because browsers persist 301s - one
# wrong Location would survive the fix). Admin static is deliberately served
# from one prefix only: the old deep links keep working through the 302 (the
# ui/admin/upstreams.html stub lands on /a/index.html the same way).
location = /_ui/admin {
    absolute_redirect off;
    add_header Cache-Control "no-store";
    return 302 /a/;
}
location ^~ /_ui/admin/ {
    absolute_redirect off;
    add_header Cache-Control "no-store";
    rewrite ^/_ui/admin/(.*)$ /a/$1 redirect;
}
location ^~ /_ui/ {
    absolute_redirect off;
    set_by_lua_block $lmr_ui_root {
        local ok, store = pcall(require, "resty.luarouter.config_store")
        local dir = ok and store and store.env("LMR_UI_DIR") or os.getenv("LMR_UI_DIR")
        if dir == nil or dir == "" then dir = "/usr/local/share/llama-ui" end
        return (dir:gsub("/+$", "")) .. "/"
    }
    alias $lmr_ui_root;
    index index.html;
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types application/javascript application/json application/manifest+json
               image/svg+xml text/css text/javascript text/plain;
}

# webui 与 admin 共用同一个 UI 根（LMR_UI_DIR，admin 就在 <root>/admin/），所以下面
# 两个静态块的形状与 ^~ /_ui/ 逐字一致，只差 alias 的末段。
# exact /u 补没有尾斜杠的入口：alias 前缀块会把 /u 当成目录而 404，所以显式
# 302 到 /u/（同 /a 的形状：no-store + 相对引用，理由见上面的 /_ui 块）。
location = /u {
    absolute_redirect off;
    add_header Cache-Control "no-store";
    return 302 /u/;
}
# webui 的规范入口。^~ 让静态前缀排在正则之前；/u/ 下的 API 名字全部由上面的
# exact location 接走（exact 优先于 ^~），所以这里只会答磁盘上的静态文件。
# /u/admin/... 与 /a/... 指向同一批文件（webui 根与 admin 根重叠：admin 就住在
# <LMR_UI_DIR>/admin/）。把 /u/admin/ 整棵 302 到 /a/，管理台只留 /a/ 一个可
# 书签入口。^~ /u/admin/ 比 ^~ /u/ 更长所以被优先选中；/u/ 下的 API 名字全部由
# 上面的 exact location 接走（exact 优先于 ^~），不受影响。
location ^~ /u/admin/ {
    absolute_redirect off;
    add_header Cache-Control "no-store";
    rewrite ^/u/admin/(.*)$ /a/$1 redirect;
}
location ^~ /u/ {
    absolute_redirect off;
    set_by_lua_block $lmr_u_root {
        local ok, store = pcall(require, "resty.luarouter.config_store")
        local dir = ok and store and store.env("LMR_UI_DIR") or os.getenv("LMR_UI_DIR")
        if dir == nil or dir == "" then dir = "/usr/local/share/llama-ui" end
        return (dir:gsub("/+$", "")) .. "/"
    }
    alias $lmr_u_root;
    index index.html;
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types application/javascript application/json application/manifest+json
               image/svg+xml text/css text/javascript text/plain;
}
# /a/ —— 管理台静态（<root>/admin/）。alias 末段固定 /admin/，所以 /a/ 与
# /a/index.html 命中同一份壳；壳内相对引用（./app.css、./vendor/…、iframe src 的
# models.html）整体落在 /a/ 前缀下，不回头找 /_ui。数据面仍是 /_ui/config* 全家
# （ui/admin/api.js 的路径契约，本轮刻意不在 /a 或 /u 下复制）。
# exact /a 补的是没有尾斜杠的书签：alias 前缀块会把 /a 当成 <root>/admin（一个
# 目录）而 404，所以这里显式 302 到 /a/，同样 no-store + 相对引用。
location = /a {
    absolute_redirect off;
    add_header Cache-Control "no-store";
    return 302 /a/;
}
location ^~ /a/ {
    absolute_redirect off;
    set_by_lua_block $lmr_a_root {
        local ok, store = pcall(require, "resty.luarouter.config_store")
        local dir = ok and store and store.env("LMR_UI_DIR") or os.getenv("LMR_UI_DIR")
        if dir == nil or dir == "" then dir = "/usr/local/share/llama-ui" end
        return (dir:gsub("/+$", "")) .. "/admin/"
    }
    alias $lmr_a_root;
    index index.html;
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types application/javascript application/json application/manifest+json
               image/svg+xml text/css text/javascript text/plain;
}
