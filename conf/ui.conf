# ── UI 入口层（lua-router）：/ admin 管理台 + /u/ webui + 根数据面 + 根端点 ────
#
# 拓扑（用户裁定 2026-10-08：admin 管理台迁到根路径，/u/ 完全不动，/_ui 全部取消）：
#   · / —— Quasar 管理台静态。由 conf/nginx.conf.template 的 `location /` 提供
#     （root = <LMR_UI_DIR>/admin/，index index.html，try_files 未命中落回
#     @lmr_klib 走 klib.router）。壳与四页的相对引用（./app.css、./vendor/…、
#     iframe src 的 models.html）整体落在根前缀下。
#   · /a/ 与 /a —— 管理台旧入口，两条 exact 各 302 到 /（保兼容，见文件末尾）。
#   · /u/ —— llamacpp webui 的入口：静态 bundle（alias <LMR_UI_DIR>/）+ 全套 webui
#     API 别名（同一批 ui.lua handler，机械复制改前缀；逐条 exact =）。本轮一行未动。
#   · /u/admin/* —— 与静态根重叠的旧路径，整棵 302 到 /（管理台只留根一个入口）。
#   · 根数据面 —— 原 /_ui/config* 与 /_ui/logs* /_ui/stats 全家（13 条 exact）搬到
#     根上的 exact location，handler 一字未改；那是 ui/admin/api.js 的路径契约。
#   · /_ui/* 全部取消：没有 302、没有别名、没有静态块。这类请求落 `location /` →
#     try_files 未命中 → @lmr_klib → klib 的 404 sink 回答 not_found JSON。
#   · 根路径补齐 webui bundle 自带的根路径 fetch（见「根路径补齐」块）；未注册的
#     路径仍必须由 404 sink 回答 not_found JSON，不许提前缀兜底。
#
# Include this fragment inside the http server block:
#     include /usr/local/openresty/nginx/conf/lua-router/ui.conf;
# (tests use an absolute path into the repo). Every API path is an exact `=`
# location so it outranks the ^~ static prefix blocks; the config/logs handlers
# must NOT be prefix locations or they would shadow same-named static files
# (the legacy root tool pages were removed -- doc/ui-trim-legacy-pages.md --
# and the exact-match discipline stays so /config cannot be answered from disk
# either).
#
# Parity target: gateway/src/server.rs ui_api_routes() + ui_logs_routes() +
# ui_config_routes() + the ServeDir mount. Handlers live in
# resty.luarouter.ui (aliases), .props, .config_store, .observability.
#
# Auth: none. The whole gateway auth surface was removed (doc/scope-trim.md),
# so every UI alias is open here - which is also how Rust leaves the
# ui_logs_routes / ui_config_routes groups and the ServeDir SPA mount. The
# trust boundary is the edge (authz) or the network, not this file.


