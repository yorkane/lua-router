# PD 感知版 /readiness（仅在 SMG_GRPC_PORT > 0 时由入口脚本 include 进 server{}）
#
# 为什么要有这个片段：PD 就绪判据（两池各至少一个健康 worker）属于 gRPC/PD 面，
# 而判定本身在请求路径上的落点是 router.lua 的 /readiness —— 那个文件不在本任务
# 的所有权范围内。nginx 的 location 匹配优先级提供了不改它的办法：精确 location
# 优先于 `location /`，所以这里用同名精确 location 覆盖，判定逻辑复用
# registry.readiness()（内部即 pd.readiness）。
#
# 完全没注册 PD worker 时 pd.readiness 走「任一健康 worker 即 ready」，响应与
# router.lua 原版逐字节一致（同样的 status/healthy_workers/total_workers 键），
# 所以开启 gRPC 但未使用 PD 的部署不会看到语义或形状变化。
#
# HEAD 与 GET 同状态、零 body：axum 的 get() 对 HEAD 也应答（test_head_routes.py
# 把 /readiness 列在里面），覆盖之后必须保住这条。
location = /readiness {
    content_by_lua_block {
        local registry = require("resty.luarouter.registry")
        local cjson = require("cjson.safe")
        local ready, report = registry.readiness({})
        local body = cjson.encode(report) or '{"status":"not ready"}'
        ngx.status = ready and 200 or 503
        ngx.header["Content-Type"] = "application/json"
        if ngx.req.get_method() ~= "HEAD" then
            ngx.print(body)
        end
    }
}
