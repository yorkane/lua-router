# lua-router 裸配置（不经 envsubst，全部字面量）
#
# 用途：把整套路由配置直接喂给 openresty 做验证或最小部署，不需要入口脚本。
# 生产容器走 nginx.conf.template + docker-entrypoint.sh，行为与本文件一致，
# 只是那些值来自环境变量。
#
# 语法 gate（挂载仓库到 /repo）：
#   docker run --rm -v /path/to/lua-router:/repo:ro \
#     --entrypoint openresty authz:latest \
#     -t -p /usr/local/openresty/nginx/ -c /repo/conf/lua-router.conf
#
# 直接起（容器内，模块已 COPY 进 site/lualib）：
#   docker run -d --name lua-router --network host \
#     -e SMG_WORKER_URLS=http://127.0.0.1:18001 lua-router:latest \
#     /docker-entrypoint.sh openresty -p /usr/local/openresty/nginx \
#       -c /usr/local/openresty/nginx/conf/lua-router/lua-router.conf -g 'daemon off;'
#
# 所有行为开关（策略、熔断、健康检查、重试、请求日志容量、LMR_* 运行配置）都由
# resty.luarouter.config / config_store 在 init 阶段读环境变量，本文件不含占位符。
#
# 注意：nginx 会按 `env` 白名单重建 worker 进程的环境，凡是在**请求期**用
# os.getenv 读的开关都必须先 `env NAME;` 放行。

# Fixed at 1 rather than auto: this file is the direct-run/test config, and
# cache_aware's affinity tree is per-process (doc/impl-policies.md deviation 1).

# OpenTelemetry 追踪（doc/gap-otel.md）：otel.lua 在 init 阶段抓取这组开关，conf 三处
# 同样声明，这样 worker 里的 os.getenv / /probe/otel 也能读到。SMG_ENABLE_TRACE 默认
# 关闭；SMG_OTLP_TRACES_ENDPOINT 这里走的是 OTLP/HTTP JSON（默认 4318），与 Rust 的
# OTLP gRPC（默认 localhost:4317）只差在传输层，W3C 上下文与 span 字段是对齐的。
env SMG_ENABLE_TRACE;
env SMG_OTLP_TRACES_ENDPOINT;
env SMG_TRACE_BATCH_SIZE;
env SMG_TRACE_BATCH_INTERVAL_MS;
env SMG_TRACE_TIMEOUT_MS;
env SMG_TRACE_SAMPLE_RATIO;
env SMG_TRACE_MAX_QUEUE;
env SMG_TRACE_UPSTREAM_CHILD;

# 在途请求年龄采样器（doc/gap-inflight-age.md）：LR_INFLIGHT_SAMPLE_SECS /
# LR_INFLIGHT_TTL_SECS 在 init_by_lua 里 fork 之前抓取（init.lua wire_inflight_tracker），
# worker 环境随后被 nginx 重建，所以这两个名字也要在 env 白名单里声明一遍，规则同上面的
# SMG_ENABLE_TRACE。两个都可省略：默认按 Rust 的 20 s 采样、槽位 TTL 3600 s。
env LR_INFLIGHT_SAMPLE_SECS;
env LR_INFLIGHT_TTL_SECS;


worker_processes 1;
worker_rlimit_nofile 8192;
user root;
# 容器里指向 stderr 让 docker logs 可见；宿主机上跑改成 logs/error.log
error_log /dev/stderr warn;
pid       logs/lua-router.pid;

events {
    worker_connections 4096;
}

http {
    # Absolute path: these two files are also parsed with -c from a directory that
    # is not the nginx conf prefix (the conf gate mounts the repo at /repo), and a
    # relative `mime.types` then resolves against the config's own directory.
    include       /usr/local/openresty/nginx/conf/mime.types;
    default_type  application/octet-stream;
    # stock mime.types (OpenResty 1.31) lacks these; the SvelteKit UI needs both
    types {
        application/manifest+json webmanifest;
        text/javascript mjs;
    }
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    server_tokens off;

    lua_package_path "/usr/local/openresty/site/lualib/?.lua;/usr/local/openresty/site/lualib/?/init.lua;/usr/local/openresty/lualib/?.lua;/usr/local/openresty/lualib/?/init.lua;;";

    lua_socket_log_errors off;
    lua_socket_connect_timeout 10s;
    lua_socket_read_timeout 60s;
    lua_socket_send_timeout 60s;

    client_max_body_size 512m;
    client_body_buffer_size 4m;
    client_body_timeout 600s;
    client_header_timeout 60s;
    send_timeout 600s;
    request_pool_size 4k;
    lua_use_default_type off;

    lua_shared_dict lr_workers     2m;
    lua_shared_dict lr_policy     20m;
    lua_shared_dict lr_stats       5m;
    lua_shared_dict lr_request_log 20m;
    lua_shared_dict lr_locks       1m;
    # 并发限流计数（共享预算，见 resty.luarouter.limit）
    lua_shared_dict lr_limit      64k;
    lua_shared_dict luarouter_config 1m;

    # Docker 内嵌 DNS；宿主机直跑改成 127.0.0.53 或 resolv.conf 里的地址
    resolver 127.0.0.11 ipv6=off valid=30s;
    resolver_timeout 5s;

    init_by_lua_block {
        require("resty.luarouter").init()
    }

    init_worker_by_lua_block {
        require("resty.luarouter").worker_init()
    }

    # 客户端中途断开也要归还未释放的 load 计数
    log_by_lua_block {
        require("resty.luarouter").on_log()
    }

    server {
        listen 0.0.0.0:30000;
        server_name _;

        # 预检在 rewrite 阶段应答：nginx 还没选 location 就先跑 server 级 rewrite，
        # 于是 ui.conf 那些自带方法门的 /_ui/* 也能吃到统一的 CORS 预检（与 Rust
        # 的 CorsLayer 最外层等价）。
        rewrite_by_lua_block {
            if require("resty.luarouter.router").preflight_guard() then
                return ngx.exit(200)
            end
        }

        location / {
            content_by_lua_block {
                require("resty.luarouter.router").handle()
            }
        }

        # UI agent 的 /_ui/* 端点与静态页不写在这里：入口脚本只在文件存在时才
        # 生成 include（静态配置无法条件包含）。要走完整形态就用
        # nginx.conf.template + docker-entrypoint.sh，或手工在本 server 里加
        #   include /usr/local/openresty/nginx/conf/lua-router/ui.conf;
    }
}
